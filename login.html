<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #4f6df5;
    --primary-dark: #3b55d9;
    --text: #1f2430;
    --text-light: #6b7280;
    --border: #e2e6ef;
    --error: #e5484d;
  }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  /* 背景装饰圆 */
  body::before, body::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
  }
  body::before { width: 480px; height: 480px; top: -160px; left: -120px; }
  body::after  { width: 360px; height: 360px; bottom: -120px; right: -80px; }

  .card {
    width: 100%;
    max-width: 420px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    box-shadow: 0 24px 64px rgba(30, 40, 90, 0.28);
    padding: 44px 40px 36px;
    position: relative;
    z-index: 1;
    animation: rise .5s ease-out;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo {
    width: 56px; height: 56px;
    margin: 0 auto 16px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--primary), #8a5cf6);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 26px; font-weight: 700;
    box-shadow: 0 8px 20px rgba(79, 109, 245, 0.35);
  }

  h1 { font-size: 24px; color: var(--text); text-align: center; margin-bottom: 6px; }
  .subtitle { font-size: 14px; color: var(--text-light); text-align: center; margin-bottom: 28px; }

  .field { margin-bottom: 18px; }
  .field label {
    display: block; font-size: 13px; color: var(--text);
    font-weight: 600; margin-bottom: 7px;
  }
  .input-wrap { position: relative; }
  .input-wrap svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; stroke: #9aa3b5; pointer-events: none;
  }
  .input-wrap input {
    width: 100%;
    padding: 13px 44px;
    font-size: 15px;
    color: var(--text);
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .input-wrap input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(79, 109, 245, 0.12);
  }
  .input-wrap input.invalid { border-color: var(--error); }

  .toggle-pwd {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 4px;
    display: flex; color: #9aa3b5;
  }
  .toggle-pwd:hover { color: var(--primary); }

  .error-msg {
    font-size: 12px; color: var(--error);
    margin-top: 6px; display: none;
  }
  .error-msg.show { display: block; }

  .row {
    display: flex; align-items: center; justify-content: space-between;
    margin: 4px 0 24px; font-size: 13px;
  }
  .remember { display: flex; align-items: center; gap: 7px; color: var(--text-light); cursor: pointer; }
  .remember input { accent-color: var(--primary); width: 15px; height: 15px; cursor: pointer; }
  .forgot { color: var(--primary); text-decoration: none; font-weight: 600; }
  .forgot:hover { text-decoration: underline; }

  .btn {
    width: 100%; padding: 14px;
    font-size: 16px; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, var(--primary), #6a5cf6);
    border: none; border-radius: 12px; cursor: pointer;
    box-shadow: 0 10px 24px rgba(79, 109, 245, 0.35);
    transition: transform .15s, box-shadow .15s, opacity .15s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 14px 28px rgba(79, 109, 245, 0.42); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: .7; cursor: not-allowed; transform: none; }

  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 26px 0 18px; color: #b0b6c3; font-size: 12px;
  }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .socials { display: flex; gap: 12px; }
  .socials button {
    flex: 1; padding: 11px;
    background: #fff; border: 1.5px solid var(--border); border-radius: 12px;
    cursor: pointer; font-size: 13px; color: var(--text);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: border-color .2s, background .2s;
  }
  .socials button:hover { border-color: var(--primary); background: #f7f9ff; }
  .socials svg { width: 18px; height: 18px; }

  .signup { text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-light); }
  .signup a { color: var(--primary); font-weight: 600; text-decoration: none; }
  .signup a:hover { text-decoration: underline; }

  @media (max-width: 480px) {
    .card { padding: 32px 24px 28px; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">T</div>
    <h1>欢迎回来</h1>
    <p class="subtitle">登录后即可继续使用你的待办清单</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="account">账号</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" id="account" name="account" placeholder="用户名 / 邮箱" autocomplete="username" />
        </div>
        <p class="error-msg" id="accountError">请输入账号</p>
      </div>

      <div class="field">
        <label for="password">密码</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" />
          <button type="button" class="toggle-pwd" id="togglePwd" aria-label="显示/隐藏密码">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <p class="error-msg" id="passwordError">密码至少 6 位</p>
      </div>

      <div class="row">
        <label class="remember"><input type="checkbox" id="remember" />记住我</label>
        <a href="#" class="forgot">忘记密码？</a>
      </div>

      <button type="submit" class="btn" id="submitBtn">登 录</button>
    </form>

    <div class="divider">或使用以下方式登录</div>

    <div class="socials">
      <button type="button">
        <svg viewBox="0 0 24 24" fill="#09bb07"><path d="M8.3 17.6c-2.4 0-4.6-1.1-5.9-2.9-1-1.4-1.3-3-.7-4.5.5-1.5 1.7-2.7 3.3-3.4 1.2-.6 2.6-.8 4-.6C9.5 4 12.1 2.4 15 2.4c4.1 0 7.5 3.1 7.7 7 .1 1.9-.6 3.7-1.9 5.1-1.3 1.5-3.1 2.4-5.1 2.6-.3 0-.6.1-.9.1-1 0-2-.2-2.9-.6l-3.6 1.6 1-2.4c0-.1-.4.2-1 .2z"/></svg>
        微信
      </button>
      <button type="button">
        <svg viewBox="0 0 24 24" fill="#12b7f5"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 3c1.7 0 3.2.6 4.4 1.6-1.3 1.3-3.4 2.1-5.9 2.3-1.9.2-3.6.9-4.8 1.9A7.9 7.9 0 0 1 12 5zm-6.9 6.4c1.4-1.4 3.6-2.4 6.2-2.5 2.4-.2 4.4.5 5.7 1.7 1 1 1.5 2.2 1.5 3.4 0 3.7-3.3 6.6-7.4 6.6-3.4 0-6.3-2-7.2-4.8-.3-1-.1-2.5 1.2-4.4z"/></svg>
        QQ
      </button>
      <button type="button">
        <svg viewBox="0 0 24 24" fill="#333"><path d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.5.5.09.66-.22.66-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02A9.56 9.56 0 0 1 12 6.8c.85.004 1.71.115 2.51.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.75c0 .27.16.58.67.48A10.01 10.01 0 0 0 22 12c0-5.52-4.48-10-10-10z"/></svg>
        GitHub
      </button>
    </div>

    <p class="signup">还没有账号？<a href="#">立即注册</a></p>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const account = document.getElementById('account');
  const password = document.getElementById('password');
  const accountError = document.getElementById('accountError');
  const passwordError = document.getElementById('passwordError');
  const submitBtn = document.getElementById('submitBtn');

  document.getElementById('togglePwd').addEventListener('click', () => {
    password.type = password.type === 'password' ? 'text' : 'password';
  });

  function setError(input, msgEl, show) {
    input.classList.toggle('invalid', show);
    msgEl.classList.toggle('show', show);
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const accBad = account.value.trim() === '';
    const pwdBad = password.value.length < 6;
    setError(account, accountError, accBad);
    setError(password, passwordError, pwdBad);
    if (accBad || pwdBad) return;

    submitBtn.disabled = true;
    submitBtn.textContent = '登录中…';
    // 模拟登录请求，实际项目中替换为 fetch 调用后端接口
    setTimeout(() => {
      submitBtn.disabled = false;
      submitBtn.textContent = '登 录';
      alert('登录成功（演示）');
    }, 1200);
  });

  [account, password].forEach(el =>
    el.addEventListener('input', () => setError(el, el === account ? accountError : passwordError, false))
  );
</script>
</body>
</html>
