<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="login">
    <section class="login-card" aria-labelledby="login-title">
      <header class="login-card__header">
        <figure class="login-card__logo" aria-hidden="true">T</figure>
        <h1 class="login-card__title" id="login-title">欢迎回来</h1>
        <p class="login-card__subtitle">登录后即可继续使用你的待办清单</p>
      </header>

      <form class="login-form" id="login-form" novalidate>
        <dl class="login-form__fields">
          <dt class="login-form__label">
            <label for="account">账号</label>
          </dt>
          <dd class="login-form__control">
            <svg class="login-form__icon" viewBox="0 0 24 24" fill="none" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <input class="login-form__input" type="text" id="account" name="account"
                   placeholder="用户名 / 邮箱" autocomplete="username" />
            <p class="login-form__error" id="account-error">请输入账号</p>
          </dd>

          <dt class="login-form__label">
            <label for="password">密码</label>
          </dt>
          <dd class="login-form__control">
            <svg class="login-form__icon" viewBox="0 0 24 24" fill="none" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input class="login-form__input" type="password" id="password" name="password"
                   placeholder="请输入密码" autocomplete="current-password" />
            <button class="login-form__toggle" type="button" id="toggle-password" aria-label="显示或隐藏密码">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
            <p class="login-form__error" id="password-error">密码至少 6 位</p>
          </dd>
        </dl>

        <p class="login-form__options">
          <label class="login-form__remember">
            <input type="checkbox" id="remember" name="remember" />
            记住我
          </label>
          <a class="login-form__forgot" href="#">忘记密码？</a>
        </p>

        <button class="login-form__submit" type="submit" id="submit-button">登 录</button>
      </form>

      <footer class="login-card__footer">
        <p class="login-social__caption">或使用以下方式登录</p>
        <menu class="login-social">
          <li>
            <button class="login-social__button" type="button">
              <svg class="login-social__icon" viewBox="0 0 24 24" fill="#09bb07" aria-hidden="true">
                <path d="M8.3 17.6c-2.4 0-4.6-1.1-5.9-2.9-1-1.4-1.3-3-.7-4.5.5-1.5 1.7-2.7 3.3-3.4 1.2-.6 2.6-.8 4-.6C9.5 4 12.1 2.4 15 2.4c4.1 0 7.5 3.1 7.7 7 .1 1.9-.6 3.7-1.9 5.1-1.3 1.5-3.1 2.4-5.1 2.6-.3 0-.6.1-.9.1-1 0-2-.2-2.9-.6l-3.6 1.6 1-2.4c0-.1-.4.2-1 .2z" />
              </svg>
              微信
            </button>
          </li>
          <li>
            <button class="login-social__button" type="button">
              <svg class="login-social__icon" viewBox="0 0 24 24" fill="#12b7f5" aria-hidden="true">
                <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 3c1.7 0 3.2.6 4.4 1.6-1.3 1.3-3.4 2.1-5.9 2.3-1.9.2-3.6.9-4.8 1.9A7.9 7.9 0 0 1 12 5zm-6.9 6.4c1.4-1.4 3.6-2.4 6.2-2.5 2.4-.2 4.4.5 5.7 1.7 1 1 1.5 2.2 1.5 3.4 0 3.7-3.3 6.6-7.4 6.6-3.4 0-6.3-2-7.2-4.8-.3-1-.1-2.5 1.2-4.4z" />
              </svg>
              QQ
            </button>
          </li>
          <li>
            <button class="login-social__button" type="button">
              <svg class="login-social__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.5.5.09.66-.22.66-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02A9.56 9.56 0 0 1 12 6.8c.85.004 1.71.115 2.51.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.75c0 .27.16.58.67.48A10.01 10.01 0 0 0 22 12c0-5.52-4.48-10-10-10z" />
              </svg>
              GitHub
            </button>
          </li>
        </menu>
        <p class="login-card__signup">还没有账号？<a href="#">立即注册</a></p>
      </footer>
    </section>
  </main>

  <script src="js/main.js" defer></script>
</body>
</html>
